<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Country Guessing Games</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        boxShadow: {
                            aquarium: '0 24px 48px rgba(3, 19, 27, 0.28)'
                        }
                    }
                }
            }
        </script>
        <link rel="stylesheet" href="../css/aquarium-theme.css">
    </head>
    <body class="aquarium-shell">
        <div class="mx-auto max-w-6xl px-4 py-12">
            <header class="text-center">
                <h1 class="aquarium-title text-3xl md:text-5xl">Country Guessing Games</h1>
                <h2 class="mt-4 text-xl md:text-2xl font-semibold tracking-[0.12em] uppercase text-sky-50/90">Select Quiz Below</h2>
            </header>

            <div class="aquarium-panel mx-auto mt-8 max-w-5xl rounded-[28px] p-4 md:p-6 shadow-aquarium">
                <div class="grid gap-4 md:grid-cols-2">
                    <div class="selection-card"><p>European Countries</p><button id="b1" class="ocean-button px-5 py-3">Enter</button></div>
                    <div class="selection-card"><p>Asian Countries</p><button id="b2" class="ocean-button px-5 py-3">Enter</button></div>
                    <div class="selection-card"><p>African Countries</p><button id="b3" class="ocean-button px-5 py-3">Enter</button></div>
                    <div class="selection-card"><p>North American Countries</p><button id="b4" class="ocean-button px-5 py-3">Enter</button></div>
                    <div class="selection-card"><p>South American Countries</p><button id="b5" class="ocean-button px-5 py-3">Enter</button></div>
                    <div class="selection-card md:col-span-2"><p>Go Back</p><button id="b8" class="ocean-button px-5 py-3">Enter</button></div>
                </div>
            </div>
        </div>
    </body>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">
   <script>
        $(document).ready(function(){
            $("#b1").click(function(){
                localStorage.setItem("Continent","Eu");
                window.location.href="CountryBase.html";
            });
            $("#b2").click(function(){
                localStorage.setItem("Continent","As");
                window.location.href="CountryBase.html";
            });
            $("#b3").click(function(){
                localStorage.setItem("Continent","Af");
                window.location.href="CountryBase.html";
            });
            $("#b4").click(function(){
                localStorage.setItem("Continent","Na");
                window.location.href="CountryBase.html";
            });
            $("#b5").click(function(){
                localStorage.setItem("Continent","Sa");
                window.location.href="CountryBase.html";
            });

            $("#b8").click(function(){
                window.location.href="GeoBase.html";
            });
        });
    </script>
</html>
