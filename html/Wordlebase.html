<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Wordle</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        boxShadow: {
                            aquarium: '0 24px 48px rgba(3, 19, 27, 0.28)'
                        }
                    }
                }
            }
        </script>
        <link rel="stylesheet" href="../css/base.css">
    </head>
    <body class="aquarium-shell">
        <div class="mx-auto max-w-3xl px-4 py-12 text-center">
            <div class="aquarium-panel rounded-[28px] p-6 shadow-aquarium">
                <p id="movediv" class="mb-5"></p>
                <h1 id="titleh1" class="aquarium-title text-3xl md:text-5xl">Wordle</h1>
                <p id="userStatus" class="mt-5 text-left"></p>
                <p id="messageBox" class="mt-3 text-left"></p>
                <div id="User-input" class="mt-5">
                    <input id="inputbox" type="text" class="w-full text-lg">
                    <button id="enterbutton" class="ocean-button px-5 py-3">Enter</button>
                </div>
                <p id="hadp" class="mt-5 text-left">Letters already entered</p>
                <div id="wordsHad" class="mt-3 min-h-[80px] text-left"></div>
            </div>
        </div>
    </body>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">
    <script type="module" src="../javascript/Wordlebase.js" defer></script>

</html>
