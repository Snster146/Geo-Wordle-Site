<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Wordle</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        boxShadow: {
                            aquarium: '0 24px 48px rgba(3, 19, 27, 0.28)'
                        }
                    }
                }
            }
        </script>
        <link rel="stylesheet" href="../css/base.css">
    </head>
    <body class="aquarium-shell">
        <div class="mx-auto max-w-6xl px-4 py-10">
            <div class="aquarium-panel rounded-[28px] p-5 md:p-8 shadow-aquarium">
                <div class="mb-6 flex flex-col items-center justify-between gap-4 md:flex-row md:items-center">
                    <p id="movediv" class="m-0 flex h-16 w-24 items-center justify-center rounded-xl border-2 border-sky-800 bg-sky-100 text-lg font-bold text-slate-800">0/0</p>
                    <h1 id="titleh1" class="aquarium-title text-2xl md:text-5xl">Wordle</h1>
                    <p id="userStatus" class="m-0 rounded-lg border-2 border-sky-700 bg-sky-100 px-4 py-2 text-sm font-bold uppercase tracking-[0.12em] text-slate-800">In Progress</p>
                </div>

                <div id="messageBox" class="mb-5 rounded-xl border-2 border-sky-700 bg-sky-50 px-4 py-3 text-sm font-medium text-slate-800">Enter a 5-letter guess.</div>

                <div id="User-input" class="mb-5 flex flex-col gap-3 md:flex-row">
                    <input id="inputbox" type="text" maxlength="5" class="w-full rounded-xl border-2 border-sky-700 bg-sky-50 px-4 py-3 text-lg text-slate-800 outline-none focus:border-sky-900" placeholder="Guess here">
                    <button id="enterbutton" class="ocean-button px-6 py-3 text-base md:w-auto">Enter</button>
                </div>

                <div id="wordle-game" class="grid gap-5 lg:grid-cols-2"></div>
            </div>
        </div>
    </body>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">
    <script type="module" src="../javascript/Wordlebase.js" defer></script>

</html>
