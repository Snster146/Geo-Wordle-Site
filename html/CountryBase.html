<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Country Guessing</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        boxShadow: {
                            aquarium: '0 24px 48px rgba(3, 19, 27, 0.28)'
                        }
                    }
                }
            }
        </script>
        <link rel="stylesheet" href="../css/aquarium-theme.css">
    </head>
    <body class="aquarium-shell">
        <div class="mx-auto max-w-6xl px-4 py-10 md:py-12">
            <div class="aquarium-panel mx-auto max-w-5xl rounded-[28px] p-5 md:p-8 shadow-aquarium">
                <header class="mb-8 text-center">
                    <h2 id="h1ttl" class="aquarium-title"></h2>
                </header>

                <div class="flex flex-col items-center gap-4 md:flex-row md:justify-center">
                    <button id="refreshbttn" class="ocean-button px-5 py-3">Refresh</button>
                    <button id="homebttn" class="ocean-button px-5 py-3">Home</button>
                    <button id="giveupbtn" class="ocean-button px-5 py-3">Give Up</button>
                </div>
            </div>
        </div>
    </body>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">
    <script type="module" src="../javascript/countrybase.js" defer></script>
</html>
