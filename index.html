<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Educational BrainTeaser Game</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        boxShadow: {
                            aquarium: '0 24px 48px rgba(3, 19, 27, 0.28)'
                        }
                    }
                }
            }
        </script>
        <link rel="stylesheet" href="./css/aquarium-theme.css">
    </head>
    <body class="aquarium-shell">
        <div class="mx-auto max-w-5xl px-4 py-12">
            <header class="mb-8 text-center">
                <h1 class="aquarium-title text-3xl md:text-5xl">Educational BrainTeaser Game</h1>
                <h2 class="mt-4 text-xl md:text-2xl font-semibold tracking-[0.12em] uppercase text-sky-50/90">Select Game Mode</h2>
            </header>

            <div class="aquarium-panel mx-auto max-w-4xl rounded-[28px] p-4 md:p-7 shadow-aquarium">
                <div class="grid gap-4 md:grid-cols-2">
                    <div class="selection-card">
                        <p id="p1">Word Games</p>
                        <button id="b1" class="ocean-button px-5 py-3">Enter</button>
                    </div>
                    <div class="selection-card">
                        <p id="p2">Geography Games</p>
                        <button id="b2" class="ocean-button px-5 py-3">Enter</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
        <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">
        <script src="./javascript/HomePage.js"></script>
    </body>
</html>
